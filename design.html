<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Design — 鄭乃慈 Nai Tzu Cheng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #f5f3ec;
  --ink-dim: rgba(245,243,236,0.55);
  --ink-mute: rgba(245,243,236,0.3);
  --accent: rgba(180,200,220,1);   /* cool muted slate-blue for design series */
  --font-sans: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-tc: 'Noto Sans TC', sans-serif;
}
html, body {
  height: 100%; width: 100%;
  background: #050505;
  color: var(--ink);
  font-family: var(--font-sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ============ CORNER UI (matches creation.html) ============ */
.corner {
  position: fixed;
  z-index: 100;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
  text-transform: uppercase;
}
.corner a { color: inherit; text-decoration: none; transition: color .25s; }
.corner a:hover { color: var(--ink); }
.tl { top: 28px; left: 32px; line-height: 1.6; }
.tl .name-tc { font-family: var(--font-tc); font-size: 13px; letter-spacing: 0.15em; color: var(--ink); font-weight: 400; text-transform: none; display: block; margin-bottom: 2px; }
.tl .name-en { font-size: 10px; color: var(--ink-dim); }
.tr { top: 28px; right: 32px; }
.tr a { display: inline-flex; align-items: center; gap: 8px; }
.tr a::before { content: '←'; opacity: 0.5; }

/* ============ STAGE LAYOUT ============ */
.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  perspective: 1400px;
}

/* Each project row: large jpg left, text right.
   Stacked vertically; we slide them along Y via transform. */
#projects {
  position: relative;
  width: min(86vw, 1280px);
  max-width: 1280px;
  height: 100%;
}
.project {
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 56px;
  align-items: center;
  transition: transform 800ms cubic-bezier(.2,.7,.2,1), opacity 600ms ease, filter 600ms ease;
  pointer-events: none;
}
.project.is-current {
  pointer-events: auto;
}
.project.is-current .pcard {
  cursor: pointer;
}

/* Image card */
.pcard {
  aspect-ratio: 4 / 3;
  background: #0a0a0a;
  border: 1px solid rgba(245,243,236,0.06);
  display: grid;
  place-items: center;
  overflow: hidden;
  position: relative;
  transition: border-color .35s, box-shadow .35s, transform .5s;
}
.pcard img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 1s ease;
}
.pcard.placeholder {
  background:
    linear-gradient(135deg, rgba(245,243,236,0.04), rgba(245,243,236,0.01)),
    radial-gradient(circle at 30% 30%, rgba(245,243,236,0.08), transparent 60%);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--ink-mute);
  text-transform: uppercase;
  text-align: center;
  padding: 24px;
  line-height: 1.8;
}
.project.is-current .pcard {
  border-color: rgba(245,243,236,0.18);
  box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(245,243,236,0.04);
}
.project.is-current .pcard:hover img {
  transform: scale(1.025);
}

/* Right text panel */
.pmeta {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 18px;
  padding: 20px 8px;
}
.pmeta .id-line {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.4em;
  color: var(--ink-mute);
  text-transform: uppercase;
}
.pmeta .title-tc {
  font-family: var(--font-tc);
  font-size: 28px;
  font-weight: 300;
  line-height: 1.3;
  letter-spacing: 0.05em;
  color: var(--ink);
}
.pmeta .title-en {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--ink-dim);
  text-transform: uppercase;
  margin-top: -8px;
}
.pmeta .specs {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 8px 24px;
  margin-top: 4px;
  font-size: 12px;
  align-items: baseline;
}
.pmeta .specs dt {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--ink-mute);
  text-transform: uppercase;
  padding-top: 3px;
}
.pmeta .specs dd {
  font-family: var(--font-tc);
  font-size: 13px;
  font-weight: 300;
  color: var(--ink-dim);
  letter-spacing: 0.03em;
  line-height: 1.5;
}
.pmeta .specs dd.has-en {
  font-family: var(--font-sans);
}
.pmeta .blurb {
  font-family: var(--font-tc);
  font-size: 13px;
  line-height: 1.85;
  font-weight: 300;
  color: var(--ink-dim);
  letter-spacing: 0.03em;
  margin-top: 12px;
  max-width: 480px;
}
.pmeta .cta {
  margin-top: 18px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--ink-mute);
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: color .25s;
  cursor: pointer;
  width: max-content;
}
.pmeta .cta::after {
  content: '→';
  display: inline-block;
  transition: transform .35s;
}
.project.is-current .pcard:hover ~ .pmeta .cta,
.pmeta .cta:hover {
  color: var(--ink);
}
.project.is-current .pcard:hover ~ .pmeta .cta::after,
.pmeta .cta:hover::after {
  transform: translateX(6px);
}

/* ============ NON-CURRENT STATES ============ */
.project.is-above {
  transform: translate(0, calc(-50% - 110vh));
  opacity: 0;
}
.project.is-below {
  transform: translate(0, calc(-50% + 110vh));
  opacity: 0;
}
.project.is-prev {
  transform: translate(0, calc(-50% - 100vh));
  opacity: 0.18;
  filter: blur(2px);
}
.project.is-next {
  transform: translate(0, calc(-50% + 100vh));
  opacity: 0.18;
  filter: blur(2px);
}
.project.is-current {
  transform: translate(0, -50%);
  opacity: 1;
}

/* ============ NAV ARROWS + COUNTER ============ */
.nav-side {
  position: fixed;
  right: 32px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 18px;
  z-index: 60;
  align-items: center;
}
.nav-arrow {
  width: 36px;
  height: 36px;
  border: 1px solid rgba(245,243,236,0.22);
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  background: rgba(5,5,5,0.4);
  color: var(--ink-dim);
  font-size: 13px;
  transition: all .25s;
  user-select: none;
}
.nav-arrow:hover {
  border-color: var(--ink);
  color: var(--ink);
  background: rgba(245,243,236,0.05);
}
.nav-arrow:active { transform: scale(0.94); }
.counter {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--ink-mute);
  text-align: center;
  line-height: 1.3;
}
.counter strong {
  display: block;
  color: var(--ink);
  font-weight: 400;
  font-size: 14px;
  letter-spacing: 0.1em;
}

/* ============ PROGRESS DOTS (left side) ============ */
.dots {
  position: fixed;
  left: 32px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 60;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(245,243,236,0.18);
  cursor: pointer;
  transition: all .35s;
}
.dot:hover { background: rgba(245,243,236,0.5); }
.dot.active {
  background: var(--ink);
  transform: scale(1.5);
  box-shadow: 0 0 12px rgba(245,243,236,0.4);
}

/* ============ HINT ============ */
.hint {
  position: fixed;
  bottom: 18px;
  right: 32px;
  z-index: 80;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-mute);
  text-transform: uppercase;
}
.hint kbd {
  display: inline-block;
  padding: 2px 6px;
  border: 1px solid rgba(245,243,236,0.3);
  border-radius: 2px;
  font-family: inherit;
  font-size: 9px;
  margin: 0 2px;
}

/* ============ DETAIL MODAL ============ */
#detail-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(5,5,5,0.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 400ms ease;
}
#detail-backdrop.active {
  opacity: 1;
  pointer-events: auto;
}

#detail-modal {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(0.97);
  width: min(92vw, 1320px);
  height: min(88vh, 820px);
  z-index: 1600;
  background: #0a0a0a;
  border: 1px solid rgba(245,243,236,0.1);
  opacity: 0;
  pointer-events: none;
  transition: opacity 400ms ease, transform 500ms cubic-bezier(.2,.7,.2,1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#detail-modal.active {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}
.detail-header {
  padding: 22px 28px 18px;
  border-bottom: 1px solid rgba(245,243,236,0.06);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-shrink: 0;
}
.detail-header .htxt h2 {
  font-family: var(--font-tc);
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.05em;
  color: var(--ink);
}
.detail-header .htxt .en {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--ink-dim);
  text-transform: uppercase;
  margin-top: 4px;
}
#detail-close {
  width: 36px;
  height: 36px;
  border: 1px solid var(--ink-dim);
  border-radius: 50%;
  background: rgba(5,5,5,0.6);
  color: var(--ink);
  font-size: 18px;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  font-family: var(--font-sans);
  transition: all .25s;
}
#detail-close:hover {
  border-color: var(--ink);
  box-shadow: 0 0 14px rgba(245,243,236,0.2);
}
#detail-close:active { transform: scale(0.94); }

.detail-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #060606;
}
/* Main large image */
.gallery-main {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050505;
  overflow: hidden;
  padding: 24px 68px;
}
.gallery-main img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  animation: fadein 400ms ease;
}
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.gallery-main .placeholder-msg {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.28em;
  color: var(--ink-mute);
  text-transform: uppercase;
  text-align: center;
  padding: 40px;
  line-height: 2;
}
/* Prev/next arrows over main image */
.gallery-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid rgba(245,243,236,0.2);
  background: rgba(5,5,5,0.5);
  backdrop-filter: blur(6px);
  color: var(--ink-dim);
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 16px;
  transition: all .25s;
  user-select: none;
  z-index: 2;
}
.gallery-nav:hover { border-color: var(--ink); color: var(--ink); }
.gallery-nav.gprev { left: 20px; }
.gallery-nav.gnext { right: 20px; }
.gallery-nav.hidden { display: none; }
/* Thumbnail strip */
.gallery-strip {
  flex-shrink: 0;
  height: 96px;
  display: flex;
  gap: 10px;
  padding: 14px 20px;
  overflow-x: auto;
  overflow-y: hidden;
  background: #0a0a0a;
  border-top: 1px solid rgba(245,243,236,0.06);
  align-items: center;
}
.gallery-strip::-webkit-scrollbar { height: 5px; }
.gallery-strip::-webkit-scrollbar-track { background: transparent; }
.gallery-strip::-webkit-scrollbar-thumb { background: rgba(245,243,236,0.15); border-radius: 3px; }
.gthumb {
  height: 68px;
  aspect-ratio: 4/3;
  flex-shrink: 0;
  background: #050505;
  border: 1px solid rgba(245,243,236,0.08);
  cursor: pointer;
  overflow: hidden;
  transition: border-color .25s, opacity .25s;
  opacity: 0.5;
}
.gthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gthumb:hover { opacity: 0.85; }
.gthumb.active { opacity: 1; border-color: var(--ink); }
.gthumb.ph {
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--ink-mute);
  text-transform: uppercase;
}
/* Image counter */
.gallery-count {
  position: absolute;
  bottom: 16px;
  right: 20px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--ink-dim);
  background: rgba(5,5,5,0.5);
  backdrop-filter: blur(6px);
  padding: 4px 10px;
  border-radius: 2px;
  z-index: 2;
}

/* Mobile */
/* ============ TABLET ============ */
@media (max-width: 1024px) and (min-width: 901px) {
  #projects { width: 90vw; }
  .project { grid-template-columns: 1fr 1fr; gap: 36px; }
  .pmeta .title-tc { font-size: 24px; }
  .pmeta .blurb { font-size: 12.5px; }
}

/* ============ MOBILE — natural vertical scroll, all projects stacked ============ */
@media (max-width: 900px) {
  html, body { overflow-y: auto; overflow-x: hidden; height: auto; }
  .stage {
    position: static;
    display: block;
    min-height: 100vh;
    padding: 92px 0 60px;
    perspective: none;
  }
  #projects {
    position: static;
    width: 100%;
    height: auto;
    display: flex;
    flex-direction: column;
    gap: 64px;
    padding: 0 22px;
  }
  /* Each project becomes a normal stacked card, image over text */
  .project {
    position: static !important;
    transform: none !important;
    opacity: 1 !important;
    filter: none !important;
    pointer-events: auto !important;
    display: flex;
    flex-direction: column;
    gap: 20px;
    top: auto;
  }
  .project.is-above, .project.is-below,
  .project.is-prev, .project.is-next, .project.is-current {
    transform: none !important;
    opacity: 1 !important;
    filter: none !important;
  }
  .pcard { aspect-ratio: 4/3; cursor: pointer; }
  .project .pcard {
    border-color: rgba(245,243,236,0.14);
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  }
  .pmeta { padding: 0 4px; gap: 14px; }
  .pmeta .title-tc { font-size: 22px; }
  .pmeta .blurb { font-size: 13px; max-width: none; }
  .pmeta .cta {
    color: var(--ink);
    border: 1px solid rgba(245,243,236,0.25);
    padding: 12px 18px;
    border-radius: 3px;
    justify-content: center;
    margin-top: 8px;
  }
  /* Hide desktop-only side navigation; scrolling replaces it */
  .nav-side, .dots, .hint { display: none; }
  .corner.tl { top: 16px; left: 18px; }
  .corner.tr { top: 16px; right: 18px; font-size: 9px; }
  /* Detail gallery modal fills the screen */
  #detail-modal { width: 100vw; height: 100vh; border: none; }
  .detail-header { padding: 16px 18px 14px; }
  .detail-header .htxt h2 { font-size: 18px; }
  .gallery-main { padding: 16px 52px; }
  .gallery-nav { width: 36px; height: 36px; font-size: 14px; }
  .gallery-nav.gprev { left: 10px; }
  .gallery-nav.gnext { right: 10px; }
  .gallery-strip { height: 74px; padding: 10px 14px; gap: 8px; }
  .gthumb { height: 52px; }
}

/* Small phones */
@media (max-width: 480px) {
  #projects { padding: 0 16px; gap: 52px; }
  .pmeta .title-tc { font-size: 20px; }
  .pmeta .specs { grid-template-columns: max-content 1fr; gap: 6px 16px; }
  .detail-header .htxt h2 { font-size: 16px; }
  .gallery-main { padding: 12px 44px; }
}
</style>
</head>
<body>

<div class="corner tl">
  <a href="index.html">
    <span class="name-tc">鄭乃慈</span>
    <span class="name-en">NAI TZU CHENG · DESIGN</span>
  </a>
</div>
<div class="corner tr"><a href="index.html">BACK</a></div>

<div class="stage">
  <div id="projects"></div>
</div>

<div class="dots" id="dots"></div>

<div class="nav-side">
  <div class="nav-arrow" id="prev" aria-label="Previous project">↑</div>
  <div class="counter"><strong id="cur">01</strong>/<span id="total">04</span></div>
  <div class="nav-arrow" id="next" aria-label="Next project">↓</div>
</div>

<div class="hint">
  <kbd>↑</kbd> <kbd>↓</kbd> Navigate · Click image to enter
</div>

<!-- DETAIL MODAL -->
<div id="detail-backdrop"></div>
<div id="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <div class="detail-header">
    <div class="htxt">
      <h2 id="detail-title">—</h2>
      <div class="en" id="detail-title-en">—</div>
    </div>
    <button id="detail-close" aria-label="Close">×</button>
  </div>
  <div class="detail-body">
    <div class="gallery-main" id="gallery-main">
      <div class="gallery-nav gprev" id="gallery-prev">‹</div>
      <div class="gallery-nav gnext" id="gallery-next">›</div>
      <div class="gallery-count" id="gallery-count"></div>
      <div class="placeholder-msg">IMAGES · placeholder</div>
    </div>
    <div class="gallery-strip" id="gallery-strip"></div>
  </div>
</div>

<script>
// ============ PROJECT DATA ============
// Each project: id, name_tc, name_en, location, category, area, blurb,
//   thumb  = list-page preview jpg (45° iso view)
//   images = array of image URLs shown in the detail gallery (main + strip).
//            First image is used as the opening main image.
const projects = [
  {
    id: '01',
    name_tc: '寧夏圓環男士髮廊',
    name_en: 'Ningxia Barber · Interior',
    location: '台北 · Taipei',
    category: '商業空間 · Commercial',
    area: '24 坪 · 79 m²',
    blurb: '座落於寧夏夜市圓環旁的男士髮廊,以暖白牆面與淺色木地板為基調,搭配胡桃木框景與水墨字畫,營造沉靜的日式禪意。挑高的格柵天花與軌道燈引入均勻光線,鏡台、洗髮區與等候玄關依序展開,街道櫥窗使日常喧鬧與店內靜謐形成對比。',
    thumb: 'design_img/ningxia_thumb.jpg',
    images: [
      'design_img/ningxia_01.jpg',
      'design_img/ningxia_03.jpg',
      'design_img/ningxia_04.jpg',
      'design_img/ningxia_02.jpg',
    ],
  },
  {
    id: '02',
    name_tc: '明天健',
    name_en: 'See You Tomorrow · Fitness',
    location: '台北 · 天母',
    category: '商業空間 · Commercial',
    area: '74.7 坪 · 247 m²',
    blurb: '座落於天母的雙層健身空間,以飽和的黃與深藍構築強烈的運動能量。一樓以「YOU CAN」標語牆與重量訓練區為核心,黃色量體引導入口動線;二樓翻轉為深藍天花與黃色格柵吊架的功能性訓練場,一道貫穿全場的綠色刻度衝刺跑道串起兩層樓的訓練節奏。天花上的燈具以斜向交錯的方式排列,層層向深處延伸,為場地注入律動與科技感;搭配鏡牆、TRX 吊帶與雪橇推行道,回應了自由重訓之外多元的課程需求。',
    thumb: 'design_img/seeya_thumb.jpg',
    images: [
      'design_img/seeya_facade.jpg',
      'design_img/seeya_01.jpg',
      'design_img/seeya_counter.jpg',
      'design_img/seeya_02.jpg',
      'design_img/seeya_03.jpg',
      'design_img/seeya_04.jpg',
      'design_img/seeya_05.jpg',
    ],
  },
  {
    id: '03',
    name_tc: 'PAR ONE 高爾夫俱樂部',
    name_en: 'PAR ONE · Golf Club',
    location: '台北 · 大安',
    category: '商業空間 · Commercial',
    area: '55.9 坪 · 185 m²',
    blurb: '走私人 VIP 包廂制的高爾夫模擬練習場,以深色胡桃木紋、大理石檯面與低彩度地毯構築沉穩內斂的會所氛圍。大理石門面招牌、接待櫃台、大螢幕模擬球場包廂、球桿展示牆與吧檯依序展開,暖色間接光帶勾勒出木質量體的層次。在低調奢華的空間裡,將專業的高爾夫模擬體驗與精品俱樂部的款待感結合為一。',
    thumb: 'design_img/parone_thumb.jpg',
    images: [
      'design_img/parone_01.jpg',
      'design_img/parone_02.jpg',
      'design_img/parone_03.jpg',
      'design_img/parone_04.jpg',
      'design_img/parone_05.jpg',
      'design_img/parone_06.jpg',
      'design_img/parone_07.jpg',
    ],
  },
  {
    id: '04',
    name_tc: '天生動良 PBRC',
    name_en: 'PBRC · Fitness',
    location: '台北 · 復興南路',
    category: '商業空間 · Commercial',
    area: '60.8 坪 · 201 m²',
    blurb: '座落於復興南路的健身空間,以品牌主題色粉紅為核心,搭配黑色量體與現場原有的淺色橡木紋,塑造兼具街頭潮流感與運動能量的調性。粉紅線條勾勒出接待櫃台、格框置物櫃與訓練區的輪廓,並將品牌識別的猴子商標與香蕉元素融入壁面創作,從奔跑的猴子壁畫到 PBRC 印花牆,讓空間本身成為品牌故事的延伸。',
    thumb: 'design_img/pbrc_thumb.jpg',
    images: [
      'design_img/pbrc_01.jpg',
      'design_img/pbrc_02.jpg',
      'design_img/pbrc_03.jpg',
      'design_img/pbrc_04.jpg',
      'design_img/pbrc_05.jpg',
    ],
  },
];

const N = projects.length;
let curIdx = 0;
const wrap = document.getElementById('projects');

// Build DOM
projects.forEach((p, i) => {
  const div = document.createElement('article');
  div.className = 'project';
  div.dataset.idx = i;

  const thumbHTML = p.thumb
    ? `<img src="${p.thumb}" alt="${p.name_tc}">`
    : `<div class="pcard placeholder">${p.name_en}<br>圖待補 · iso render</div>`;

  div.innerHTML = `
    <div class="pcard">
      ${p.thumb ? `<img src="${p.thumb}" alt="${p.name_tc}">` : `<div style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.25em;color:var(--ink-mute);text-transform:uppercase;text-align:center;padding:24px;line-height:1.8;">${p.name_en}<br>圖待補<br>ISO RENDER</div>`}
    </div>
    <div class="pmeta">
      <div class="id-line">N° ${p.id} · DESIGN</div>
      <div class="title-tc">${p.name_tc}</div>
      <div class="title-en">${p.name_en}</div>
      <dl class="specs">
        <dt>位置 LOC.</dt><dd>${p.location}</dd>
        <dt>類別 CAT.</dt><dd>${p.category}</dd>
        <dt>坪數 AREA</dt><dd>${p.area}</dd>
      </dl>
      <div class="blurb">${p.blurb}</div>
      <span class="cta" data-open-detail>View Detail</span>
    </div>
  `;
  wrap.appendChild(div);
});

// Build dots
const dotsEl = document.getElementById('dots');
projects.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
});

document.getElementById('total').textContent = String(N).padStart(2, '0');

const projectEls = Array.from(wrap.children);
const dotEls = Array.from(dotsEl.children);

// Mobile uses natural scroll — desktop slide-nav is disabled there
const isMobile = () => window.matchMedia('(max-width: 900px)').matches;

function layout() {
  if (isMobile()) return;  // mobile shows all projects in normal flow
  projectEls.forEach((el, i) => {
    el.classList.remove('is-current','is-prev','is-next','is-above','is-below');
    if (i === curIdx) el.classList.add('is-current');
    else if (i === curIdx - 1) el.classList.add('is-prev');
    else if (i === curIdx + 1) el.classList.add('is-next');
    else if (i < curIdx) el.classList.add('is-above');
    else el.classList.add('is-below');
  });
  dotEls.forEach((d, i) => d.classList.toggle('active', i === curIdx));
  document.getElementById('cur').textContent = String(curIdx + 1).padStart(2, '0');
}

function goTo(idx) {
  if (isMobile()) return;
  curIdx = (idx + N) % N;
  layout();
}

document.getElementById('prev').addEventListener('click', () => goTo(curIdx - 1));
document.getElementById('next').addEventListener('click', () => goTo(curIdx + 1));

window.addEventListener('keydown', (e) => {
  if (document.body.classList.contains('has-detail-active')) return;
  if (isMobile()) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); goTo(curIdx - 1); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); goTo(curIdx + 1); }
  else if (e.key === 'Home') { goTo(0); }
  else if (e.key === 'End') { goTo(N - 1); }
});

// Wheel navigation (debounced) — desktop only
let wheelTimer = null;
window.addEventListener('wheel', (e) => {
  if (isMobile()) return;
  if (document.body.classList.contains('has-detail-active')) return;
  if (wheelTimer) return;
  if (Math.abs(e.deltaY) < 12) return;
  goTo(curIdx + (e.deltaY > 0 ? 1 : -1));
  wheelTimer = setTimeout(() => { wheelTimer = null; }, 600);
}, { passive: true });

// Click pcard image OR "View Detail" to open the gallery.
// On mobile every project is visible, so the is-current check is skipped.
wrap.addEventListener('click', (e) => {
  const trigger = e.target.closest('.pcard, [data-open-detail]');
  if (!trigger) return;
  const projEl = trigger.closest('.project');
  if (!projEl) return;
  if (!isMobile() && !projEl.classList.contains('is-current')) return;
  const idx = parseInt(projEl.dataset.idx, 10);
  openDetail(idx);
});

// ============ DETAIL GALLERY MODAL ============
const backdrop = document.getElementById('detail-backdrop');
const modal = document.getElementById('detail-modal');
const titleEl = document.getElementById('detail-title');
const titleEnEl = document.getElementById('detail-title-en');
const closeBtn = document.getElementById('detail-close');
const gMain = document.getElementById('gallery-main');
const gStrip = document.getElementById('gallery-strip');
const gPrev = document.getElementById('gallery-prev');
const gNext = document.getElementById('gallery-next');
const gCount = document.getElementById('gallery-count');

let galleryImages = [];
let galleryIdx = 0;

function showGalleryImage(i) {
  if (!galleryImages.length) return;
  galleryIdx = (i + galleryImages.length) % galleryImages.length;

  // Update main image
  gMain.querySelectorAll('img, .placeholder-msg').forEach(el => el.remove());
  const img = document.createElement('img');
  img.src = galleryImages[galleryIdx];
  img.alt = titleEl.textContent + ' — ' + (galleryIdx + 1);
  gMain.insertBefore(img, gPrev);

  // Update active thumbnail
  Array.from(gStrip.children).forEach((t, k) => t.classList.toggle('active', k === galleryIdx));
  // Scroll active thumb into view
  const activeThumb = gStrip.children[galleryIdx];
  if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

  // Counter
  gCount.textContent = `${String(galleryIdx + 1).padStart(2,'0')} / ${String(galleryImages.length).padStart(2,'0')}`;

  // Arrow visibility
  const single = galleryImages.length <= 1;
  gPrev.classList.toggle('hidden', single);
  gNext.classList.toggle('hidden', single);
  gCount.style.display = single ? 'none' : '';
}

function openDetail(idx) {
  const p = projects[idx];
  if (!p) return;

  titleEl.textContent = p.name_tc;
  titleEnEl.textContent = p.name_en;

  galleryImages = (p.images && p.images.length) ? p.images.slice() : [];
  galleryIdx = 0;

  // Build thumbnail strip
  gStrip.innerHTML = '';
  if (galleryImages.length) {
    galleryImages.forEach((src, k) => {
      const th = document.createElement('div');
      th.className = 'gthumb' + (k === 0 ? ' active' : '');
      const im = document.createElement('img');
      im.src = src;
      im.loading = 'lazy';
      th.appendChild(im);
      th.addEventListener('click', () => showGalleryImage(k));
      gStrip.appendChild(th);
    });
    showGalleryImage(0);
  } else {
    // No images yet — placeholder state
    gMain.querySelectorAll('img, .placeholder-msg').forEach(el => el.remove());
    const ph = document.createElement('div');
    ph.className = 'placeholder-msg';
    ph.innerHTML = 'IMAGES · 待補<br>45° iso + interior renders';
    gMain.insertBefore(ph, gPrev);
    gCount.textContent = '';
    gPrev.classList.add('hidden');
    gNext.classList.add('hidden');
    // placeholder thumbs
    for (let i = 0; i < 4; i++) {
      const th = document.createElement('div');
      th.className = 'gthumb ph';
      th.textContent = String(i + 1).padStart(2, '0');
      gStrip.appendChild(th);
    }
  }

  backdrop.classList.add('active');
  modal.classList.add('active');
  document.body.classList.add('has-detail-active');
}

function closeDetail() {
  backdrop.classList.remove('active');
  modal.classList.remove('active');
  document.body.classList.remove('has-detail-active');
  setTimeout(() => {
    gMain.querySelectorAll('img').forEach(el => el.remove());
    gStrip.innerHTML = '';
    galleryImages = [];
  }, 400);
}

gPrev.addEventListener('click', (e) => { e.stopPropagation(); showGalleryImage(galleryIdx - 1); });
gNext.addEventListener('click', (e) => { e.stopPropagation(); showGalleryImage(galleryIdx + 1); });
closeBtn.addEventListener('click', closeDetail);
backdrop.addEventListener('click', closeDetail);

window.addEventListener('keydown', (e) => {
  if (!document.body.classList.contains('has-detail-active')) return;
  if (e.key === 'Escape') closeDetail();
  else if (e.key === 'ArrowLeft') { e.preventDefault(); showGalleryImage(galleryIdx - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); showGalleryImage(galleryIdx + 1); }
});

// Initial layout
layout();

// Re-apply correct layout when crossing the mobile/desktop breakpoint
// (e.g. tablet rotation, window resize). On returning to desktop, clear
// mobile flow and re-center on the first project.
let wasMobile = isMobile();
window.addEventListener('resize', () => {
  const nowMobile = isMobile();
  if (nowMobile !== wasMobile) {
    wasMobile = nowMobile;
    if (nowMobile) {
      // switching to mobile: strip desktop position classes
      projectEls.forEach(el => el.classList.remove('is-current','is-prev','is-next','is-above','is-below'));
    } else {
      curIdx = 0;
      layout();
    }
  }
});
</script>

</body>
</html>
