<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Creation — 鄭乃慈 Nai Tzu Cheng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@400&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #f5f3ec;
  --ink-dim: rgba(245,243,236,0.55);
  --ink-mute: rgba(245,243,236,0.3);
  --series-zoo: rgba(241,165,200,1);    /* pink */
  --series-ufo: rgba(80,200,255,1);     /* fluorescent blue */
  --series-duck: rgba(255,160,80,1);    /* orange */
  --font-sans: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-tc: 'Noto Sans TC', sans-serif;
}
html, body { height: 100%; width: 100%; background: #050505; color: var(--ink); font-family: var(--font-sans); overflow: hidden; }

/* ============ POND - bigger, brighter, sits visibly under the items ============ */
.pond-wrap {
  position: fixed;
  left: 50%;
  top: 50%;
  /* Pulled down so it's visible BELOW the center item, peeking out */
  transform: translate(-50%, 30%);
  width: 720px;
  height: 720px;
  z-index: 5;
  pointer-events: none;
  perspective: 700px;
}
.pond {
  width: 100%;
  height: 100%;
  transform: rotateX(74deg);
  transform-origin: center center;
  position: relative;
  /* Larger visible pond, softer falloff */
  mask-image: radial-gradient(ellipse 48% 48% at 50% 50%, black 0%, black 65%, transparent 96%);
  -webkit-mask-image: radial-gradient(ellipse 48% 48% at 50% 50%, black 0%, black 65%, transparent 96%);
}
#pondCanvas { width: 100%; height: 100%; display: block; }

.pond-glow {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, 25%);
  width: 90vw; height: 60vh;
  z-index: 2; pointer-events: none;
  background: radial-gradient(ellipse 50% 35% at 50% 50%, var(--glow-color, rgba(255,160,80,0.25)) 0%, transparent 70%);
  filter: blur(32px);
  transition: background 900ms ease;
}

/* ============ STAGE - ring of items ============ */
.stage {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1600px;
  perspective-origin: 50% 45%;
  pointer-events: none;
}
.ring {
  position: relative;
  width: 1px; height: 1px;
  transform-style: preserve-3d;
  margin-top: -10vh;
}

.item {
  position: absolute;
  left: 0; top: 0;
  width: 280px; height: 280px;
  margin-left: -140px;
  margin-top: -140px;
  transform-style: preserve-3d;
  pointer-events: auto;
  cursor: pointer;
  transition: transform 850ms cubic-bezier(.4,.0,.2,1);
}
.item-inner {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 700ms cubic-bezier(.4,.0,.2,1), filter 700ms;
}
.item-art {
  width: 100%;
  height: 78%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.item-art img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  /* NO filter/drop-shadow on the image itself - keeps colors pure */
  user-select: none;
  -webkit-user-drag: none;
}

/* Glow comes from behind the image via a separate layer, not via filter */
.item-art::before {
  content: '';
  position: absolute;
  inset: -10%;
  background: radial-gradient(ellipse 60% 60% at 50% 55%, var(--glow, rgba(255,200,140,0.18)), transparent 70%);
  filter: blur(20px);
  z-index: -1;
  opacity: 0;
  transition: opacity 600ms;
  pointer-events: none;
}
.item.is-center .item-art::before {
  opacity: 1;
}

.item-art.placeholder {
  width: 60%; height: 78%;
  background: radial-gradient(ellipse at center, rgba(255,245,220,0.06), rgba(255,245,220,0.01));
  border: 1px dashed rgba(245,243,236,0.18);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 0.15em;
  color: var(--ink-mute);
  text-transform: uppercase;
  text-align: center;
  padding: 16px; line-height: 1.6;
}

.series-band {
  width: 50px; height: 1px;
  margin-top: 8px;
  background: var(--band-color, rgba(245,243,236,0.2));
  box-shadow: 0 0 6px var(--band-color, rgba(245,243,236,0.2));
  opacity: 0.55;
  transition: width 700ms, opacity 700ms;
}

/* ============ STATES ============ */
.item.is-center .item-inner {
  opacity: 1 !important;
  filter: none !important;
}
.item.is-center .series-band {
  width: 120px;
  opacity: 1;
}
.item.is-center .item-art {
  animation: float-c 6.5s ease-in-out infinite;
}
@keyframes float-c {
  0%,100% { transform: translateY(0) rotate(-0.4deg); }
  50% { transform: translateY(-12px) rotate(0.4deg); }
}

.item.is-center.entering .item-inner {
  animation: enter 900ms cubic-bezier(.2,.7,.3,1.2) both;
}
@keyframes enter {
  0%   { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.item.is-side .item-inner { opacity: 0.65; }
.item.is-back .item-inner { opacity: 0.32; filter: blur(1.2px); }
.item.is-far .item-inner  { opacity: 0.1; filter: blur(2px); }

/* ============ CORNER UI ============ */
.corner {
  position: fixed;
  z-index: 100;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
  text-transform: uppercase;
}
.corner a { color: inherit; text-decoration: none; transition: color .25s; }
.corner a:hover { color: var(--ink); }
.tl { top: 28px; left: 32px; line-height: 1.6; }
.tl .name-tc { font-family: var(--font-tc); font-size: 13px; letter-spacing: 0.15em; color: var(--ink); font-weight: 400; text-transform: none; display: block; margin-bottom: 2px; }
.tl .name-en { font-size: 10px; color: var(--ink-dim); }
.tr { top: 28px; right: 32px; }
.tr a { display: inline-flex; align-items: center; gap: 8px; }
.tr a::before { content: '←'; opacity: 0.5; }

/* ============ INFO PANEL ============ */
.info {
  position: fixed;
  left: 50%;
  bottom: 12vh;
  transform: translateX(-50%);
  z-index: 60;
  text-align: center;
  pointer-events: none;
  width: 90%;
  max-width: 540px;
}
.info-series {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  margin-bottom: 10px;
  opacity: 0.9;
  transition: color 700ms, opacity 500ms;
}
.info-title {
  font-family: var(--font-sans);
  font-size: 21px;
  font-weight: 300;
  letter-spacing: 0.01em;
  color: var(--ink);
  margin-bottom: 6px;
  transition: opacity 400ms;
}
.info-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--ink-dim);
  transition: opacity 400ms;
}
.info.changing .info-title, .info.changing .info-meta { opacity: 0; }

/* ============ CONTROLS ============ */
.controls {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 24px;
  font-family: var(--font-mono);
}
.arrow {
  width: 40px; height: 40px;
  border: 1px solid var(--ink-mute);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-dim);
  font-size: 14px;
  cursor: pointer;
  background: rgba(5,5,5,0.55);
  backdrop-filter: blur(6px);
  transition: all .25s;
  user-select: none;
}
.arrow:hover { border-color: var(--ink); color: var(--ink); box-shadow: 0 0 14px rgba(255,245,220,0.15); }
.arrow:active { transform: scale(0.94); }
.counter {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--ink-dim);
  min-width: 56px;
  text-align: center;
}
.counter strong { color: var(--ink); font-weight: 500; }

.series-dots {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 70;
  display: flex;
  gap: 6px;
  pointer-events: none;
}
.series-dots .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(245,243,236,0.2);
  transition: all .4s;
}
.series-dots .dot.active {
  background: var(--ink);
  width: 18px;
  border-radius: 3px;
}

.hint {
  position: fixed;
  bottom: 14px;
  right: 32px;
  z-index: 80;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-mute);
  text-transform: uppercase;
}
.hint kbd {
  font-family: inherit;
  border: 1px solid var(--ink-mute);
  padding: 1px 5px;
  border-radius: 3px;
  margin: 0 2px;
  color: var(--ink-dim);
}

@media (max-width: 768px) {
  .item { width: 200px; height: 200px; margin-left: -100px; margin-top: -100px; }
  .info-title { font-size: 17px; }
  .info { bottom: 14vh; }
  .pond-wrap { width: 480px; height: 480px; }
  .tl .name-tc { font-size: 12px; }
  .hint { display: none; }
  .series-dots { bottom: 90px; }
}

/* ============ 3D OVERLAY (sits on top of center item when work has GLB) ============ */
/* Strategy: full-viewport canvas (so model never gets cropped), but z-index
   sits BELOW the UI controls (arrows, dots, info, corner) and ABOVE the ring items.
   The canvas itself has transparent background; we use a centered loading text. */
#three-overlay {
  position: fixed;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  /* Above the ring's center item (z-index ~1500) but below UI (arrows 80 are fine since they're absolutely positioned outside the canvas's drawn region) */
  z-index: 1600;
  pointer-events: none;
  opacity: 0;
  transition: opacity 350ms ease;
}
#three-overlay.active { opacity: 1; }
#three-overlay.active canvas {
  pointer-events: auto;
  cursor: grab;
}
#three-overlay.active canvas:active { cursor: grabbing; }
#three-overlay canvas {
  width: 100%;
  height: 100%;
  display: block;
}
#three-loading {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--ink-mute);
  text-transform: uppercase;
  pointer-events: none;
}

/* Hide the center PNG when 3D is showing for that item — prevents overlap.
   Note: when overlay is full-viewport with z 1600, PNG ring is below anyway,
   but keep the visual class for clean transition. */
body.has-3d-active .item.is-center .item-art img,
body.has-3d-active .item.is-center .item-art.placeholder {
  opacity: 0;
  transition: opacity 300ms ease;
}
body.has-3d-active .item.is-center .item-art::before {
  opacity: 0.5;
}

/* Make sure UI controls stay above the overlay canvas */
.corner, .info, .series-dots, .controls, .hint {
  z-index: 2000;
}
</style>
</head>
<body>

<div class="pond-glow" id="pondGlow"></div>
<div class="pond-wrap"><div class="pond"><canvas id="pondCanvas"></canvas></div></div>

<div class="corner tl">
  <span class="name-tc">鄭乃慈</span>
  <span class="name-en">NAI TZU CHENG</span>
</div>
<div class="corner tr"><a href="index.html">Home</a></div>

<div class="stage"><div class="ring" id="ring"></div></div>

<div id="three-overlay">
  <div id="three-loading">Loading 3D…</div>
</div>

<div class="info" id="info">
  <div class="info-series" id="info-series">DUCK PARK SERIES</div>
  <div class="info-title" id="info-title">Magic Duck II — Sculpture</div>
  <div class="info-meta" id="info-meta">Banqiao Duck Park · 2024</div>
</div>

<div class="series-dots" id="dots"></div>

<div class="controls">
  <div class="arrow" id="prev">‹</div>
  <div class="counter"><strong id="cur">04</strong> / 12</div>
  <div class="arrow" id="next">›</div>
</div>

<div class="hint"><kbd>←</kbd> <kbd>→</kbd> Navigate · Drag to rotate</div>

<script>
const T = {
  "magic_duck": "creations/magic_duck.png",
  "magic_duck2": "creations/magic_duck2.png",
  "pumkin": "creations/pumkin.png",
  "pumking2": "creations/pumking2.png",
  "cats": "creations/cats.png",
  "mushroom": "creations/mushroom.png",
  "trees": "creations/trees.png",
  "books": "creations/books.png",
  "broom": "creations/broom.png",
};

const items = [
  { id:'01', name:'Otter — Aroma Stone', series:'zoo', client:'Taipei Zoo · 2025', img:null },
  { id:'02', name:'UFO — Public Installation', series:'ufo', client:'Xizhi Stellar Park · 2024', img:null, glb:'creations/ufo.glb' },
  { id:'03', name:'Magic Duck I — Sculpture', series:'duck', client:'Banqiao Duck Park · 2024', img:'magic_duck' },
  { id:'04', name:'Magic Duck II — Sculpture', series:'duck', client:'Banqiao Duck Park · 2024', img:'magic_duck2' },
  { id:'05', name:'Pumpkin I — Heart Weave', series:'duck', client:'Banqiao Duck Park · 2024', img:'pumkin' },
  { id:'06', name:'Pumpkin II — Jack-o-Lantern', series:'duck', client:'Banqiao Duck Park · 2024', img:'pumking2' },
  { id:'07', name:'Cats Tower — Stack', series:'duck', client:'Banqiao Duck Park · 2024', img:'cats' },
  { id:'08', name:'Mushroom Trio', series:'duck', client:'Banqiao Duck Park · 2024', img:'mushroom' },
  { id:'09', name:'Tree Forest — Heart Arch', series:'duck', client:'Banqiao Duck Park · 2024', img:'trees' },
  { id:'10', name:'Book Set — Letters', series:'duck', client:'Banqiao Duck Park · 2024', img:'books', glb:'creations/book.glb' },
  { id:'11', name:'Broom Collection', series:'duck', client:'Banqiao Duck Park · 2024', img:'broom' },
  { id:'12', name:'Coming Soon', series:null, client:'Future · TBD', img:null },
];

const seriesMap = {
  zoo:  { label:'PRODUCT DEVELOPMENT', color:'rgba(241,165,200,1)', pond:[0.95, 0.65, 0.82], glow:'rgba(241,165,200,0.28)' },   // pink
  ufo:  { label:'PUBLIC INSTALLATION', color:'rgba(80,200,255,1)',   pond:[0.31, 0.78, 1.0],  glow:'rgba(80,200,255,0.3)'   },   // fluorescent blue
  duck: { label:'DUCK PARK EXHIBITION', color:'rgba(255,160,80,1)',  pond:[1.0, 0.62, 0.31],  glow:'rgba(255,160,80,0.28)'  },   // orange
  none: { label:'— · —', color:'rgba(245,243,236,0.4)', pond:[0.7, 0.7, 0.7], glow:'rgba(245,245,220,0.15)' },
};

const ring = document.getElementById('ring');
const N = items.length;
let centerIdx = 3;
let prevCenter = -1;

const RADIUS_X = 360;
const RADIUS_Y = 140;
const DEPTH = 500;

const itemEls = items.map((it, i) => {
  const div = document.createElement('div');
  div.className = 'item';
  div.dataset.idx = i;
  const sCol = it.series ? seriesMap[it.series].color : 'rgba(245,243,236,0.18)';
  const sGlow = it.series ? seriesMap[it.series].glow : 'rgba(255,245,220,0.15)';
  let artHTML;
  if (it.img && T[it.img]) {
    artHTML = `<div class="item-art" style="--glow:${sGlow}"><img src="${T[it.img]}" alt="${it.name}"></div>`;
  } else {
    const lbl = it.id === '12' ? 'Coming<br>Soon' : it.name.split('—')[0].trim() + '<br><span style="opacity:.5">圖待補</span>';
    artHTML = `<div class="item-art placeholder">${lbl}</div>`;
  }
  div.innerHTML = `<div class="item-inner">${artHTML}<div class="series-band" style="--band-color:${sCol}"></div></div>`;
  div.addEventListener('click', () => goTo(i));
  ring.appendChild(div);
  return div;
});

function layout() {
  items.forEach((it, i) => {
    let rel = i - centerIdx;
    if (rel > N/2) rel -= N;
    if (rel < -N/2) rel += N;

    const theta = rel * (2 * Math.PI / N);

    const x = Math.sin(theta) * RADIUS_X;
    const y = -(1 - Math.cos(theta)) * RADIUS_Y;
    const z = Math.cos(theta) * DEPTH;

    const isCenter = Math.abs(rel) < 0.5;
    const scale = isCenter ? 1.25 : 0.5;

    const el = itemEls[i];
    el.style.transform = `translate3d(${x}px, ${y}px, ${z - DEPTH * 0.3}px) scale(${scale})`;
    el.style.zIndex = Math.round(1000 + z);

    el.classList.remove('is-center','is-side','is-back','is-far','entering');
    const absR = Math.abs(rel);
    if (absR < 0.5) {
      el.classList.add('is-center');
      if (i !== prevCenter) {
        void el.offsetWidth;
        el.classList.add('entering');
      }
    }
    else if (absR < 1.7) el.classList.add('is-side');
    else if (absR < 3.5) el.classList.add('is-back');
    else el.classList.add('is-far');
  });

  const it = items[centerIdx];
  const info = document.getElementById('info');
  info.classList.add('changing');
  setTimeout(() => {
    document.getElementById('cur').textContent = it.id;
    document.getElementById('info-title').textContent = it.name;
    document.getElementById('info-meta').textContent = it.client;
    const seriesKey = it.series || 'none';
    const sInfo = seriesMap[seriesKey];
    const sEl = document.getElementById('info-series');
    sEl.textContent = sInfo.label;
    sEl.style.color = sInfo.color;
    pondColor = sInfo.pond;
    document.getElementById('pondGlow').style.setProperty('--glow-color', sInfo.glow);
    info.classList.remove('changing');
  }, 200);

  buildDots();
  prevCenter = centerIdx;

  // Notify 3D overlay (if any work has GLB)
  window.dispatchEvent(new CustomEvent('centerchange', {
    detail: { idx: centerIdx, item: items[centerIdx] }
  }));
}

function buildDots() {
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === centerIdx ? ' active' : '');
    if (i === centerIdx && it.series) {
      d.style.background = seriesMap[it.series].color;
    }
    dots.appendChild(d);
  });
}

function goTo(idx) {
  if (idx === centerIdx) return;
  centerIdx = idx;
  layout();
}

document.getElementById('next').addEventListener('click', () => goTo((centerIdx+1) % N));
document.getElementById('prev').addEventListener('click', () => goTo((centerIdx-1+N) % N));

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft')  { e.preventDefault(); goTo((centerIdx-1+N) % N); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); goTo((centerIdx+1) % N); }
  else if (e.key === 'Home') { goTo(0); }
  else if (e.key === 'End')  { goTo(N-1); }
});

/* Drag to rotate */
let isDragging = false, dragStartX = 0, dragStartIdx = 0;
const DRAG_THRESHOLD = 70;
window.addEventListener('mousedown', (e) => {
  if (e.target.closest('.arrow') || e.target.closest('a')) return;
  isDragging = true; dragStartX = e.clientX; dragStartIdx = centerIdx;
  document.body.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const newIdx = (dragStartIdx - Math.round(dx / DRAG_THRESHOLD) + N * 10) % N;
  if (newIdx !== centerIdx) { centerIdx = newIdx; layout(); }
});
window.addEventListener('mouseup', () => { isDragging = false; document.body.style.cursor = ''; });
window.addEventListener('touchstart', (e) => {
  if (e.target.closest('.arrow') || e.target.closest('a')) return;
  isDragging = true; dragStartX = e.touches[0].clientX; dragStartIdx = centerIdx;
}, {passive: true});
window.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - dragStartX;
  const newIdx = (dragStartIdx - Math.round(dx / DRAG_THRESHOLD) + N * 10) % N;
  if (newIdx !== centerIdx) { centerIdx = newIdx; layout(); }
}, {passive: true});
window.addEventListener('touchend', () => { isDragging = false; });

layout();
setTimeout(() => {
  const c = itemEls[centerIdx]; void c.offsetWidth; c.classList.add('entering');
}, 50);

/* ============ POND SHADER ============ */
const cv = document.getElementById('pondCanvas');
const gl = cv.getContext('webgl', { antialias: true, alpha: true, premultipliedAlpha: false });
const dpr = Math.min(window.devicePixelRatio || 1, 2);
let pondColor = seriesMap.duck.pond;

function fitPond() {
  const r = cv.getBoundingClientRect();
  cv.width = Math.floor(r.width * dpr); cv.height = Math.floor(r.height * dpr);
  if (gl) gl.viewport(0, 0, cv.width, cv.height);
}
fitPond();
window.addEventListener('resize', fitPond);

if (gl) {
  const VS = `attribute vec2 a_pos; varying vec2 v_uv;
    void main(){ v_uv = a_pos*0.5+0.5; gl_Position = vec4(a_pos,0.,1.); }`;
  const FS = `precision highp float;
    varying vec2 v_uv;
    uniform float u_t;
    uniform vec2 u_res;
    uniform float u_rippleAge;
    uniform vec3 u_color;
    float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
    float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
    float fbm(vec2 p){ float v=0.,a=0.5; for(int i=0;i<5;i++){v+=a*noise(p);p*=2.02;a*=0.5;} return v; }

    void main(){
      vec2 uv = v_uv;
      vec2 px = uv;
      px.x *= u_res.x/u_res.y;
      vec2 center = vec2(0.5*u_res.x/u_res.y, 0.5);
      float dist = length(px - center);

      vec2 cuv = px * 5.0 + vec2(u_t*0.05, u_t*0.03);
      float caustic = fbm(cuv);
      caustic += fbm(cuv*2.0 - vec2(u_t*0.02,0.))*0.55;
      caustic = pow(caustic, 1.6);

      float pool = smoothstep(0.6, 0.0, dist);
      pool = pow(pool, 0.9);

      if (u_rippleAge > 0.0 && u_rippleAge < 5.0) {
        float rd = dist;
        float front = u_rippleAge * 0.08;
        float w = rd - front;
        if (abs(w) < 0.22) {
          float env = exp(-pow(w/0.22, 2.0)*1.6);
          float wave = sin(w*60.0 - u_t*2.0);
          float life = 1.0 - smoothstep(0.0, 5.0, u_rippleAge);
          caustic += wave*env*life*0.35;
        }
      }

      // Brighter, more saturated pond
      vec3 deep = u_color * 0.6;
      vec3 bright = u_color * 1.15;
      vec3 col = vec3(0.0);
      col += deep * pool * 0.7;
      col += bright * caustic * pool * 1.3;
      col += bright * pool * 0.45;

      float alpha = pool * 1.0 + caustic * pool * 0.6;
      alpha = clamp(alpha, 0.0, 1.0);
      gl_FragColor = vec4(col, alpha);
    }`;
  function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
    if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;}
  const p = gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(p); gl.useProgram(p);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const lp = gl.getAttribLocation(p,'a_pos');
  gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  const u_t=gl.getUniformLocation(p,'u_t'),
        u_r=gl.getUniformLocation(p,'u_res'),
        u_ra=gl.getUniformLocation(p,'u_rippleAge'),
        u_col=gl.getUniformLocation(p,'u_color');

  let currentColor = [...pondColor];
  let start=performance.now(), lastRip=-100;
  function frame(){
    const t=(performance.now()-start)/1000;
    if (t-lastRip > 8) lastRip = t;
    for (let i = 0; i < 3; i++) {
      currentColor[i] += (pondColor[i] - currentColor[i]) * 0.05;
    }
    gl.uniform1f(u_t,t); gl.uniform2f(u_r,cv.width,cv.height);
    gl.uniform1f(u_ra,t-lastRip);
    gl.uniform3f(u_col, currentColor[0], currentColor[1], currentColor[2]);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(frame);
  }
  frame();
}
</script>

<!-- ============ 3D OVERLAY MODULE (independent, fails gracefully) ============ -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const overlay = document.getElementById('three-overlay');
const loadingEl = document.getElementById('three-loading');
if (!overlay) { console.warn('3D overlay element not found, skipping 3D'); }

const SERIES_COLORS = {
  duck: 0xff9858,
  ufo:  0x4ec0ff,
  zoo:  0xf1a5c8,
};

let currentViewer = null;
let currentGlbUrl = null;
const glbCache = new Map();

// Shared loader (Draco support for any compressed GLB)
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

function loadGLB(url) {
  if (glbCache.has(url)) return Promise.resolve(glbCache.get(url));
  return new Promise((resolve, reject) => {
    gltfLoader.load(url, (gltf) => {
      glbCache.set(url, gltf);
      resolve(gltf);
    }, undefined, reject);
  });
}

function createViewer(gltf, series) {
  // Clean overlay (keep loading el reference but remove canvas if any)
  overlay.querySelectorAll('canvas').forEach(c => c.remove());

  const w = overlay.clientWidth;
  const h = overlay.clientHeight;

  const scene = new THREE.Scene();
  // FOV chosen for product-shot feel (slight perspective, not flat ortho)
  const FOV = 28;
  const camera = new THREE.PerspectiveCamera(FOV, w / h, 0.01, 100);

  const canvas = document.createElement('canvas');
  overlay.appendChild(canvas);

  const renderer = new THREE.WebGLRenderer({
    canvas, antialias: true, alpha: true,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // PMREM environment — soft studio reflections (stronger than before for PBR pop)
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.025).texture;

  // 3-point cinematic lighting — brighter, more direction
  const key = new THREE.DirectionalLight(0xfff0d8, 3.5);
  key.position.set(2.5, 4, 3);
  key.castShadow = true;
  key.shadow.mapSize.width = 1024;
  key.shadow.mapSize.height = 1024;
  key.shadow.camera.near = 0.1;
  key.shadow.camera.far = 10;
  key.shadow.camera.left = -2;
  key.shadow.camera.right = 2;
  key.shadow.camera.top = 2;
  key.shadow.camera.bottom = -2;
  key.shadow.bias = -0.0005;
  key.shadow.radius = 4;
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xc0d8ff, 1.2);
  fill.position.set(-2.5, 1, -0.5); scene.add(fill);

  const rim = new THREE.DirectionalLight(0xffe0b0, 2.0);
  rim.position.set(-1, 2.5, -2.5); scene.add(rim);

  // Ambient lift so dark sides don't crush
  const amb = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(amb);

  // Series-colored pond uplight (subtle)
  const upColor = SERIES_COLORS[series] || 0xff9858;
  const pondUp = new THREE.PointLight(upColor, 0.8, 5, 1.8);
  pondUp.position.set(0, -1.3, 0.6); scene.add(pondUp);

  const holder = new THREE.Group();
  scene.add(holder);

  const model = gltf.scene.clone(true);
  const bbox = new THREE.Box3().setFromObject(model);
  const center = bbox.getCenter(new THREE.Vector3());
  const size = bbox.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);

  model.position.sub(center);
  // Normalize model to 1.0 unit max dim, then scale up
  const normalScale = 1.0 / maxDim;
  holder.scale.setScalar(normalScale);
  holder.add(model);

  // Dynamic camera distance: keep visual size ~constant across viewport sizes.
  // Target: model max dim should occupy ~440px on screen (matches original PNG center size + 15%)
  const targetPx = Math.min(440, h * 0.55, w * 0.4);
  const modelWorldSize = 1.0; // after normalization
  const fovRad = FOV * Math.PI / 180;
  // For a vertical FOV: visible height at distance d = 2 * d * tan(FOV/2)
  // We want: targetPx / canvas_height = modelWorldSize / visibleHeight
  // => d = modelWorldSize * canvas_height / (2 * tan(FOV/2) * targetPx)
  const camDist = (modelWorldSize * h) / (2 * Math.tan(fovRad / 2) * targetPx);
  // Position camera at angled product-shot perspective
  camera.position.set(camDist * 0.15, camDist * 0.1, camDist);
  camera.lookAt(0, 0, 0);

  // Enable shadows on mesh + tighten materials for nicer PBR
  model.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material) {
        const m = o.material;
        m.side = THREE.DoubleSide;
        if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
        // Force envMap intensity higher so PBR reflections show
        m.envMapIntensity = 1.2;
        m.needsUpdate = true;
      }
    }
  });

  // Contact shadow: a soft round shadow blob on the ground plane
  // Model bottom is at -0.5 in world space (1 unit total, centered)
  const groundY = -0.55;
  const shadowGeom = new THREE.CircleGeometry(0.45, 64);
  const shadowMat = new THREE.MeshBasicMaterial({
    color: 0x000000,
    transparent: true,
    opacity: 0.32,
    depthWrite: false,
  });
  const shadowMesh = new THREE.Mesh(shadowGeom, shadowMat);
  shadowMesh.rotation.x = -Math.PI / 2;
  shadowMesh.position.y = groundY;
  scene.add(shadowMesh);
  const shadowSoft = new THREE.Mesh(
    new THREE.CircleGeometry(0.7, 64),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.14, depthWrite: false })
  );
  shadowSoft.rotation.x = -Math.PI / 2;
  shadowSoft.position.y = groundY;
  scene.add(shadowSoft);

  // Interaction
  let dragging = false, lastInteraction = performance.now();
  let dragStartX = 0, dragStartY = 0, dragStartRotX = 0, dragStartRotY = 0;

  function onDown(e) {
    const pt = e.touches ? e.touches[0] : e;
    dragging = true;
    dragStartX = pt.clientX; dragStartY = pt.clientY;
    dragStartRotX = holder.rotation.x;
    dragStartRotY = holder.rotation.y;
    lastInteraction = performance.now();
    e.stopPropagation();
  }
  function onMove(e) {
    if (!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    holder.rotation.y = dragStartRotY + (pt.clientX - dragStartX) * 0.01;
    holder.rotation.x = Math.max(-0.8, Math.min(0.8, dragStartRotX + (pt.clientY - dragStartY) * 0.01));
    lastInteraction = performance.now();
  }
  function onUp() { dragging = false; lastInteraction = performance.now(); }

  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: true });
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('touchend', onUp);

  function onResize() {
    const nw = overlay.clientWidth;
    const nh = overlay.clientHeight;
    camera.aspect = nw / nh;
    // Recompute distance to maintain visual size
    const newTarget = Math.min(440, nh * 0.55, nw * 0.4);
    const newDist = (1.0 * nh) / (2 * Math.tan(fovRad / 2) * newTarget);
    camera.position.set(newDist * 0.15, newDist * 0.1, newDist);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    renderer.setSize(nw, nh);
  }
  window.addEventListener('resize', onResize);

  let frameId = null;
  let alive = true;
  function animate() {
    if (!alive) return;
    frameId = requestAnimationFrame(animate);
    if (!dragging && performance.now() - lastInteraction > 1500) {
      holder.rotation.y += 0.005;
    }
    const t = performance.now() * 0.001;
    const floatY = Math.sin(t * 0.8) * 0.025;
    holder.position.y = floatY;
    // shadow shrinks/grows with float to feel attached
    const shadowScale = 1.0 - floatY * 1.5;
    shadowMesh.scale.set(shadowScale, shadowScale, 1);
    shadowSoft.scale.set(shadowScale, shadowScale, 1);
    shadowMat.opacity = 0.32 - floatY * 1.0;
    renderer.render(scene, camera);
  }
  animate();

  return {
    destroy() {
      alive = false;
      if (frameId) cancelAnimationFrame(frameId);
      canvas.removeEventListener('mousedown', onDown);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      canvas.removeEventListener('touchstart', onDown);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onUp);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      pmrem.dispose();
      canvas.remove();
    }
  };
}

async function handleCenterChange(item) {
  // Tear down old viewer
  if (currentViewer) {
    currentViewer.destroy();
    currentViewer = null;
    currentGlbUrl = null;
  }
  overlay.classList.remove('active');
  document.body.classList.remove('has-3d-active');

  if (!item || !item.glb) return;

  // Show loading state
  loadingEl.style.display = 'flex';
  overlay.classList.add('active');

  const glbUrl = item.glb;
  currentGlbUrl = glbUrl;
  try {
    const gltf = await loadGLB(glbUrl);
    // Check user hasn't moved away during async load
    if (currentGlbUrl !== glbUrl) return;
    loadingEl.style.display = 'none';
    currentViewer = createViewer(gltf, item.series);
    // Now that 3D is rendering, hide the PNG behind it
    document.body.classList.add('has-3d-active');
  } catch (err) {
    console.error('GLB load failed for', glbUrl, err);
    loadingEl.textContent = '3D unavailable';
    setTimeout(() => {
      if (currentGlbUrl === glbUrl) {
        overlay.classList.remove('active');
        loadingEl.textContent = 'Loading 3D…';
        loadingEl.style.display = 'flex';
      }
    }, 2000);
  }
}

window.addEventListener('centerchange', (e) => {
  handleCenterChange(e.detail.item);
});
</script>
